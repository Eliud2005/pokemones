<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="img/icons/icon-72x72.png">
    <link rel="apple-touch-icon" href="img/icons/icon-96x96.png">
    <link rel="apple-touch-icon" href="img/icons/icon-128x128.png">
    <link rel="apple-touch-icon" href="img/icons/icon-144x144.png">
    <link rel="apple-touch-icon" href="img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" href="img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="img/icons/icon-512x512.png">

    <meta name="theme-color" content="#EE8130">
    <title>Pokémon PWA</title>
</head>
<body>
    <main>
        <nav>
            <h1>Pokémon PWA</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li>About</li>
                <li>Blog</li>
            </ul>
        </nav>

        <div class="container">
            <div class="grid-cards" id="grid-cards"></div>
        </div>
    </main>

    <!-- ============================================
         Botón flotante de instalación
         Se muestra solo si beforeinstallprompt se disparó
         y la app NO está instalada
         ============================================ -->
    <button id="install-btn" class="install-fab hidden" type="button" aria-label="Instalar aplicación">
        <span class="install-fab-icon">⬇️</span>
        <span class="install-fab-text">Instalar App</span>
    </button>

    <!-- ============================================
         Modal de confirmación de instalación
         ============================================ -->
    <div id="install-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="install-modal-title">
        <div class="modal-box">
            <h2 id="install-modal-title">📲 Instalar Pokémon PWA</h2>
            <p>Instala la app en tu dispositivo para acceder más rápido y usarla sin conexión.</p>
            <div class="modal-actions">
                <button id="install-confirm" class="btn-primary" type="button">Sí, instalar</button>
                <button id="install-cancel" class="btn-secondary" type="button">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Toast para feedback del usuario -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="js/pokemons.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
